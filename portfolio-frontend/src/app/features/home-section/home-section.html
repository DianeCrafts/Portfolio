<div class="home-wrapper">
  <div class="hero-content">
    <p class="greeting">{{ text[currentLanguage].home.greeting }}</p>
    <h1 class="name">Diane</h1>
    <p class="subtitle">
      {{ text[currentLanguage].home.subtitle }}
    </p>

    <p class="status-text" *ngIf="isLoading">Loading interests...</p>
    <p class="status-text" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="interests-container" *ngIf="!isLoading && !errorMessage">
      <div
        *ngFor="let interest of interests; let i = index"
        class="interest-box"
        [ngClass]="getInterestBoxClass(i)"
      >
        {{ interest.name }}
      </div>
    </div>
  </div>

  <div class="scroll-indicator">
    <span class="scroll-text">{{ text[currentLanguage].home.scroll }}</span>
    <div class="scroll-arrow">
      <span></span>
    </div>
  </div>
</div>
