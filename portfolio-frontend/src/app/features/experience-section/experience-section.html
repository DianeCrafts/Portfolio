@if (isLoading) {
  <p class="status-text">{{ text[currentLanguage].experience.loading }}</p>
} @else if (errorMessage) {
  <p class="status-text">{{ errorMessage }}</p>
} @else {
  <app-timeline
    [sectionTitle]="text[currentLanguage].experience.title"
    [items]="experienceItems"
  ></app-timeline>
}
