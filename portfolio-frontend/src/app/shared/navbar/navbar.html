<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-left-spacer"></div>

    <div class="navbar-center">
      <a
        class="nav-button"
        [class.active]="activeSection === 'home'"
        href="#home"
        (click)="setActiveSection('home')"
      >
        {{ text[currentLanguage].navbar.home }}
      </a>

      <a
        class="nav-button"
        [class.active]="activeSection === 'experience'"
        href="#experience"
        (click)="setActiveSection('experience')"
      >
        {{ text[currentLanguage].navbar.experience }}
      </a>

      <a
        class="nav-button"
        [class.active]="activeSection === 'projects'"
        href="#projects"
        (click)="setActiveSection('projects')"
      >
        {{ text[currentLanguage].navbar.projects }}
      </a>

      <a
        class="nav-button"
        [class.active]="activeSection === 'education'"
        href="#education"
        (click)="setActiveSection('education')"
      >
        {{ text[currentLanguage].navbar.education }}
      </a>

      <a
        class="nav-button"
        [class.active]="activeSection === 'about'"
        href="#about"
        (click)="setActiveSection('about')"
      >
        {{ text[currentLanguage].navbar.contact }}
      </a>

      <div class="resume-dropdown">
        <button class="nav-button resume-button" type="button">
          {{ text[currentLanguage].navbar.resume }}
        </button>

        <div class="resume-dropdown-menu">
          <a
            class="resume-option"
            href="/resume-en.pdf"
            target="_blank"
            rel="noopener noreferrer"
          >
            English
          </a>
          <a
            class="resume-option"
            href="/resume-fr.pdf"
            target="_blank"
            rel="noopener noreferrer"
          >
            Français
          </a>
        </div>
      </div>
    </div>

    <div class="navbar-right">
      <button class="small-toggle-button" type="button" (click)="toggleLanguage()">
        {{ text[currentLanguage].navbar.language }}
      </button>

      <button class="small-toggle-button" type="button" (click)="toggleTheme()">
        {{ currentTheme === 'light' ? 'DARK' : 'LIGHT' }}
      </button>
    </div>
  </div>
</nav>
